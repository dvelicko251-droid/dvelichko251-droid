<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Приглашение</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fdf7f3;
}

body {
    font-family: Arial, sans-serif;
}

/* Контейнер всех страниц */
.slider {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

/* Лента страниц */
.pages {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.75s cubic-bezier(0.77, 0, 0.175, 1);
}

/* Одна страница */
.page {
    flex: 0 0 100vw;
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #fdf7f3;
}

/* Картинка страницы */
.page > img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* ------------------------------------------------ */
/* КНОПКА НА ПЕРВОЙ СТРАНИЦЕ */
/* ------------------------------------------------ */

.open-button {
    position: absolute;

    /*
      Зона кнопки расположена внизу первой картинки.
      Она прозрачная, сама картинка остаётся без изменений.
    */

    left: 28%;
    width: 44%;
    bottom: 11%;
    height: 9%;

    z-index: 10;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* ------------------------------------------------ */
/* ТАЙМЕР */
/* ------------------------------------------------ */

#liveCountdown {
    position: absolute;
    z-index: 20;

    /*
      Общая область четырёх кружков
    */
    left: 0;
    width: 100%;

    /*
      Положение по вертикали относительно картинки
    */
    top: 40.7%;

    height: 11%;

    pointer-events: none;

    display: grid;

    /*
      Четыре позиции под четыре кружочка
    */
    grid-template-columns:
        15.5%
        20.5%
        20.5%
        20.5%;

    column-gap: 0;

    padding-left: 5%;
}

/* Каждая цифра */
#liveCountdown .unit {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

/* Сама цифра */
#liveCountdown .number {
    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(42px, 9vw, 78px);

    line-height: 1;

    font-weight: normal;

    color: #b8894f;

    white-space: nowrap;

    transform: translateY(-2px);
}

/*
  Слова "Дней / Часов / Минут / Секунд"
  полностью скрываем
*/
#liveCountdown .label {
    display: none !important;
}

/* ------------------------------------------------ */
/* СТРЕЛКИ НАВИГАЦИИ */
/* ------------------------------------------------ */

.nav-button {
    position: fixed;
    z-index: 100;

    top: 50%;
    transform: translateY(-50%);

    width: 48px;
    height: 48px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.82);

    color: #92796e;

    font-size: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 3px 15px rgba(120,80,60,0.12);

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#prev {
    left: 14px;
}

#next {
    right: 14px;
}

/* На первой странице стрелка назад не нужна */
#prev.hidden {
    display: none;
}

/* ------------------------------------------------ */
/* МОБИЛЬНАЯ АДАПТАЦИЯ */
/* ------------------------------------------------ */

@media (max-width: 600px) {

    #liveCountdown {
        top: 40.7%;
        height: 10.5%;
        padding-left: 5%;
    }

    #liveCountdown .number {
        font-size: clamp(34px, 8vw, 55px);
    }

    .nav-button {
        width: 44px;
        height: 44px;
        font-size: 25px;
    }

    #prev {
        left: 10px;
    }

    #next {
        right: 10px;
    }
}
</style>
</head>

<body>

<div class="slider">

    <div class="pages" id="pages">

        <!-- =============================== -->
        <!-- СТРАНИЦА 1 -->
        <!-- =============================== -->

        <section class="page" id="page1">

            <img src="page1.jpg.PNG" alt="Приглашение">

            <!-- Прозрачная кликабельная область кнопки -->
            <div
                class="open-button"
                onclick="goToPage(1)"
                aria-label="Открыть приглашение">
            </div>

        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 2 -->
        <!-- =============================== -->

        <section class="page" id="page2">
            <img src="page2.jpg.PNG" alt="Приглашение">
        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 3 -->
        <!-- =============================== -->

        <section class="page" id="page3">
            <img src="page3.jpg.PNG" alt="Приглашение">
        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 4 — ТАЙМЕР -->
        <!-- =============================== -->

        <section class="page" id="page4">

            <img src="page4.jpg.PNG" alt="Обратный отсчёт">

            <div id="liveCountdown">

                <div class="unit">
                    <div class="number" id="days">00</div>
                    <div class="label">Дней</div>
                </div>

                <div class="unit">
                    <div class="number" id="hours">00</div>
                    <div class="label">Часов</div>
                </div>

                <div class="unit">
                    <div class="number" id="minutes">00</div>
                    <div class="label">Минут</div>
                </div>

                <div class="unit">
                    <div class="number" id="seconds">00</div>
                    <div class="label">Секунд</div>
                </div>

            </div>

        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 5 -->
        <!-- =============================== -->

        <section class="page" id="page5">
            <img src="page5.jpg.PNG" alt="Приглашение">
        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 6 -->
        <!-- =============================== -->

        <section class="page" id="page6">
            <img src="page6.jpg.PNG" alt="Приглашение">
        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 7 -->
        <!-- =============================== -->

        <section class="page" id="page7">
            <img src="page7.jpg.PNG" alt="Приглашение">
        </section>


        <!-- =============================== -->
        <!-- СТРАНИЦА 8 -->
        <!-- =============================== -->

        <section class="page" id="page8">
            <img src="page8.jpg.PNG" alt="Приглашение">
        </section>

    </div>


    <!-- Кнопки перелистывания -->

    <button
        class="nav-button hidden"
        id="prev"
        onclick="previousPage()">
        ‹
    </button>

    <button
        class="nav-button"
        id="next"
        onclick="nextPage()">
        ›
    </button>

</div>


<script>

/* ========================================= */
/* НАСТРОЙКИ */
/* ========================================= */

let currentPage = 0;

const totalPages = 8;

const pages = document.getElementById("pages");

const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");


/* ========================================= */
/* ПЕРЕЛИСТЫВАНИЕ */
/* ========================================= */

function showPage(page) {

    if (page < 0) {
        page = 0;
    }

    if (page > totalPages - 1) {
        page = totalPages - 1;
    }

    currentPage = page;

    pages.style.transform =
        `translateX(-${currentPage * 100}vw)`;

    updateNavigation();
}


function goToPage(page) {
    showPage(page);
}


function nextPage() {
    if (currentPage < totalPages - 1) {
        showPage(currentPage + 1);
    }
}


function previousPage() {
    if (currentPage > 0) {
        showPage(currentPage - 1);
    }
}


function updateNavigation() {

    if (currentPage === 0) {
        prevButton.classList.add("hidden");
    } else {
        prevButton.classList.remove("hidden");
    }

    if (currentPage === totalPages - 1) {
        nextButton.style.display = "none";
    } else {
        nextButton.style.display = "flex";
    }
}


/* ========================================= */
/* СВАЙП ПАЛЬЦЕМ */
/* ========================================= */

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener("touchstart", function(e) {

    touchStartX = e.changedTouches[0].screenX;

}, { passive: true });


document.addEventListener("touchend", function(e) {

    touchEndX = e.changedTouches[0].screenX;

    handleSwipe();

}, { passive: true });


function handleSwipe() {

    const distance = touchEndX - touchStartX;

    /*
      Минимальное расстояние свайпа
    */

    if (Math.abs(distance) < 50) {
        return;
    }

    if (distance < 0) {
        nextPage();
    } else {
        previousPage();
    }
}


/* ========================================= */
/* ТАЙМЕР */
/* ========================================= */

const targetDate =
    new Date("2026-09-05T18:00:00");


function updateCountdown() {

    const now = new Date();

    let difference =
        targetDate.getTime() - now.getTime();


    if (difference <= 0) {

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        return;
    }


    const days =
        Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

    difference -=
        days * (1000 * 60 * 60 * 24);


    const hours =
        Math.floor(
            difference / (1000 * 60 * 60)
        );

    difference -=
        hours * (1000 * 60 * 60);


    const minutes =
        Math.floor(
            difference / (1000 * 60)
        );

    difference -=
        minutes * (1000 * 60);


    const seconds =
        Math.floor(
            difference / 1000
        );


    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}


/* Запускаем таймер */
updateCountdown();

setInterval(updateCountdown, 1000);


/* ========================================= */
/* СТАРТ */
/* ========================================= */

updateNavigation();

</script>

</body>
</html>
