<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Приглашение</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    height: 100%;
    scroll-behavior: smooth;
}

body {
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;

    background: #fdf8f5;
}

/* Каждая картинка = отдельная страница */

.page {
    position: relative;

    width: 100%;
    height: 100svh;
    min-height: 100svh;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    overflow: hidden;
}

.page img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================
   КНОПКА НА ПЕРВОЙ СТРАНИЦЕ
   ========================= */

.open-invitation {
    position: absolute;

    /*
       Кнопка находится примерно
       в нижней части первой картинки.
       Зона специально сделана прозрачной.
    */

    left: 50%;
    top: 85.5%;

    transform: translate(-50%, -50%);

    width: 44%;
    height: 7%;

    border: none;
    background: transparent;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

/* =========================
   ТАЙМЕР
   ========================= */

#liveCountdown {

    position: absolute;

    /*
       Располагаем цифры
       внутри четырёх кружочков
    */

    left: 7%;
    right: 7%;
    top: 35.8%;

    height: 9%;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    align-items: center;
    justify-items: center;

    pointer-events: none;
}

/* отдельная цифра */

.number {

    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(34px, 10vw, 62px);

    line-height: 1;

    font-weight: 400;

    color: #a67b42;

    text-align: center;

    /* убираем возможные смещения текста */
    padding: 0;
    margin: 0;
}

/* На всякий случай скрываем подписи */

.label {
    display: none !important;
}

/* =========================
   АДАПТАЦИЯ ДЛЯ ОЧЕНЬ
   УЗКИХ ТЕЛЕФОНОВ
   ========================= */

@media (max-width: 380px) {

    #liveCountdown {
        left: 6%;
        right: 6%;
        top: 35.8%;
    }

    .number {
        font-size: 34px;
    }

}

/* =========================
   НИКАКИХ ЛИШНИХ АНИМАЦИЙ
   ========================= */

button {
    font: inherit;
}

</style>
</head>


<body>


<!-- =========================
     СТРАНИЦА 1
     ========================= -->

<section class="page" id="page1">

    <img src="page1.jpg.PNG"
         alt="Приглашение">

    <!-- Прозрачная кнопка поверх кнопки на картинке -->

    <button
        class="open-invitation"
        aria-label="Открыть приглашение"
        onclick="goToPage(2)">
    </button>

</section>



<!-- =========================
     СТРАНИЦА 2 — ТАЙМЕР
     ========================= -->

<section class="page" id="page2">

    <img src="page2.jpg.PNG"
         alt="До нашей встречи осталось">

    <div id="liveCountdown">

        <div class="unit">
            <div class="number" id="days">00</div>
        </div>

        <div class="unit">
            <div class="number" id="hours">00</div>
        </div>

        <div class="unit">
            <div class="number" id="minutes">00</div>
        </div>

        <div class="unit">
            <div class="number" id="seconds">00</div>
        </div>

    </div>

</section>



<!-- =========================
     СТРАНИЦА 3
     ========================= -->

<section class="page" id="page3">

    <img src="page3.jpg.PNG"
         alt="Приглашение">

</section>



<!-- =========================
     СТРАНИЦА 4
     ========================= -->

<section class="page" id="page4">

    <img src="page4.jpg.PNG"
         alt="Приглашение">

</section>



<!-- =========================
     СТРАНИЦА 5
     ========================= -->

<section class="page" id="page5">

    <img src="page5.jpg.PNG"
         alt="Приглашение">

</section>



<!-- =========================
     СТРАНИЦА 6
     ========================= -->

<section class="page" id="page6">

    <img src="page6.jpg.PNG"
         alt="Приглашение">

</section>



<!-- =========================
     СТРАНИЦА 7
     ========================= -->

<section class="page" id="page7">

    <img src="page7.jpg.PNG"
         alt="Приглашение">

</section>



<!-- =========================
     СТРАНИЦА 8
     ========================= -->

<section class="page" id="page8">

    <img src="page8.jpg.PNG"
         alt="Приглашение">

</section>



<script>

/* ==========================================
   ПЕРЕХОД НА ВТОРУЮ СТРАНИЦУ
   ========================================== */

function goToPage(pageNumber) {

    const page = document.getElementById("page" + pageNumber);

    if (page) {

        page.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }

}


/* ==========================================
   ОБРАТНЫЙ ОТСЧЁТ
   5 СЕНТЯБРЯ 2026, 18:00
   ========================================== */

const eventDate = new Date(
    "2026-09-05T18:00:00+03:00"
).getTime();


function updateCountdown() {

    const now = new Date().getTime();

    let distance = eventDate - now;


    /* Если время уже наступило */

    if (distance <= 0) {

        distance = 0;

    }


    const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
    );


    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );


    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );


    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );


    document.getElementById("days").textContent =
        String(days).padStart(2, "0");


    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

}


/* Запускаем сразу */

updateCountdown();


/* Обновляем каждую секунду */

setInterval(updateCountdown, 1000);

</script>

</body>
</html>
