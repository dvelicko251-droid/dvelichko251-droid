<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Гендер-пати 🤍</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f8eee9;
    }

    body {
        font-family: Georgia, "Times New Roman", serif;
    }

    #app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
    }

    .page {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
        background: #f8eee9;
    }

    .page.active {
        display: flex;
        animation: fadeIn 0.6s ease;
    }

    .page img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: scale(1.015);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Невидимые зоны кнопок */

    .hotspot {
        position: absolute;
        cursor: pointer;
        z-index: 10;
        border-radius: 50px;
    }

    /* 1 экран — открыть приглашение */
    #page1 .hotspot {
        left: 31%;
        width: 38%;
        top: 51%;
        height: 12%;
       /* АНИМАЦИЯ ТРЕТЬЕГО ЭКРАНА */

#page3.active img {
    animation: envelopePage 1.8s ease-out both;
}

#page3.active::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 46%;
    width: 55%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255, 236, 222, 0.28);
    filter: blur(35px);
    opacity: 0;
    pointer-events: none;
    z-index: 1;

    animation: softGlow 2.5s ease-in-out 0.3s forwards;
}

.continue-button {
    position: absolute;
    left: 50%;
    bottom: 10%;
    transform: translateX(-50%);
    z-index: 20;

    border: none;
    border-radius: 40px;

    padding: 14px 32px;

    background: rgba(255,255,255,0.82);
    color: #8b6b68;

    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 1px;

    box-shadow: 0 6px 20px rgba(100,70,60,.12);

    opacity: 0;
    pointer-events: none;

    animation: buttonAppear 1s ease 1.7s forwards;
}

@keyframes envelopePage {

    0% {
        opacity: 0;
        transform: scale(1.025);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes softGlow {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.8);
    }

    45% {
        opacity: .65;
        transform: translate(-50%, -50%) scale(1.05);
    }

    100% {
        opacity: .12;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes buttonAppear {

    0% {
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
    }

    100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}
    }


    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.7);
    }

    50% {
        opacity: .7;
        transform: translate(-50%, -50%) scale(1.05);
    }

    100% {
        opacity: .2;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes letterAppear {

    0% {
        opacity: 0;
        transform: translate(-50%, -30%) scale(.8);
    }

    60% {
        opacity: .5;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -70%) scale(1);
    }
}

@keyframes buttonAppear {

    from {
        opacity: 0;
        transform: translateX(-50%) translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}
    /* 3 экран — продолжить */
    #page3 .hotspot {
        .page {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

    /* 5 экран — построить маршрут */
    #page5 .hotspot {
        left: 20%;
        width: 60%;
        top: 89%;
        height: 7%;
    }

    /* 7 экран — RSVP */
    #page7 .yes {
        left: 8%;
        width: 40%;
        top: 57%;
        height: 10%;
    }

    #page7 .no {
        right: 8%;
        width: 40%;
        top: 57%;
        height: 10%;
    }

    /* затемнение при переходе */
    #transition {
        position: fixed;
        inset: 0;
        background: #fff8f4;
        opacity: 0;
        pointer-events: none;
        z-index: 100;
        transition: opacity 0.3s ease;
    }

    #transition.show {
        opacity: 1;
    }

    /* Кнопка назад */
    #backButton {
        position: fixed;
        z-index: 50;
        left: 15px;
        top: 15px;
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        background: rgba(255,255,255,0.72);
        backdrop-filter: blur(8px);
        color: #8b6b68;
        font-size: 22px;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 12px rgba(120,80,70,.12);
    }

    #backButton.visible {
        display: flex;
       /* Живой таймер */
       #liveCountdown {
    position: absolute;
    z-index: 20;
    left: 7%;
    right: 7%;
    top: 36%;
    width: auto;
    display: none;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    box-sizing: border-box;
}

#liveCountdown .unit {
    width: 22%;
    flex: 0 0 22%;
    text-align: center;
    color: #a77b52;
    box-sizing: border-box;
}

#liveCountdown .number {
    font-size: clamp(25px, 7vw, 52px);
    line-height: 1;
    font-weight: normal;
    white-space: nowrap;
}

#liveCountdown .label {
    margin-top: 8px;
    font-family: Arial, sans-serif;
    font-size: clamp(10px, 2.7vw, 16px);
    color: #806a68;
    white-space: nowrap;
}

    

   
  /* маленький индикатор страниц */
    #dots {
        position: fixed;
        z-index: 40;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        gap: 5px;
    }

    #dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(130,100,100,.25);
    }

    #dots span.active {
        background: rgba(190,130,130,.85);
    }

    /* Чтобы на очень узких телефонах всё помещалось */
    @media (max-width: 390px) {
        #backButton {
            width: 36px;
            height: 36px;
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<div id="app">

    <!-- ЭКРАН 1 -->
    <section class="page active" id="page1">
        <img src="page1.jpg.PNG" alt="Гендер-пати">
        <div class="hotspot" onclick="goToPage(2)"></div>
    </section>

    <!-- ЭКРАН 2 -->
    <section class="page" id="page2">
        <img src="page2.jpg.PNG" alt="Привет">
    </section>

    <!-- ЭКРАН 3 -->
   <section class="page" id="page3">
    <img src="page3.jpg.PNG" alt="Приглашение">

    <div class="envelope-glow"></div>

    <button class="continue-button" onclick="goToPage(4)">
        ПРОДОЛЖИТЬ
    </button>

    <div class="hotspot" onclick="goToPage(4)"></div>
</section>
   
    

    <!-- ЭКРАН 4 -->
    <section class="page" id="page4">
        <img src="page4.jpg.PNG" alt="Обратный отсчёт">

        <div id="liveCountdown">
            <div class="unit">
                <div class="number" id="days">--</div>
                <div class="label">Дней</div>
            </div>

            <div class="unit">
                <div class="number" id="hours">--</div>
                <div class="label">Часов</div>
            </div>

            <div class="unit">
                <div class="number" id="minutes">--</div>
                <div class="label">Минут</div>
            </div>

            <div class="unit">
                <div class="number" id="seconds">--</div>
                <div class="label">Секунд</div>
            </div>
        </div>
    </section>

    <!-- ЭКРАН 5 -->
    <section class="page" id="page5">
        <img src="page5.jpg.PNG" alt="Место встречи">
        <div class="hotspot" onclick="openMap()"></div>
    </section>

    <!-- ЭКРАН 6 -->
    <section class="page" id="page6">
        <img src="page6.jpg.PNG" alt="Пожелания">
    </section>

    <!-- ЭКРАН 7 -->
    <section class="page" id="page7">
        <img src="page7.jpg.PNG" alt="Подтверждение присутствия">

        <div class="hotspot yes" onclick="sendYes()"></div>
        <div class="hotspot no" onclick="sendNo()"></div>
    </section>

    <!-- ЭКРАН 8 -->
    <section class="page" id="page8">
        <img src="page8.jpg.PNG" alt="Спасибо">
    </section>

</div>

<div id="transition"></div>

<button id="backButton" onclick="goBack()">‹</button>

<div id="dots">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>


<script>

    let currentPage = 1;
    const totalPages = 8;

    /*
     * ВАЖНО:
     * Сюда потом впишем номер WhatsApp.
     *
     * Формат:
     * 79991234567
     *
     * Без +, пробелов и скобок.
     */
    const whatsappNumber = "79999999999";


    function goToPage(pageNumber) {

        if (pageNumber < 1 || pageNumber > totalPages) {
            return;
        }

        const transition = document.getElementById("transition");

        transition.classList.add("show");

        setTimeout(() => {

            document.querySelectorAll(".page").forEach(page => {
                page.classList.remove("active");
            });

            document
                .getElementById("page" + pageNumber)
                .classList.add("active");

            currentPage = pageNumber;

            updateInterface();

            transition.classList.remove("show");

        }, 300);
    }


    function goBack() {

        if (currentPage > 1) {
            goToPage(currentPage - 1);
        }

    }


    function updateInterface() {

        const backButton = document.getElementById("backButton");
        const dots = document.getElementById("dots");
        const countdown = document.getElementById("liveCountdown");

        if (currentPage > 1) {
            backButton.classList.add("visible");
        } else {
            backButton.classList.remove("visible");
        }

        if (currentPage > 1 && currentPage < 8) {
            dots.style.display = "flex";
        } else {
            dots.style.display = "none";
        }

        document.querySelectorAll("#dots span").forEach((dot, index) => {
            dot.classList.toggle(
                "active",
                index === currentPage - 1
            );
        });

        if (currentPage === 4) {
            countdown.style.display = "flex";
        } else {
            countdown.style.display = "none";
        }
    }


    /* =========================
       ОБРАТНЫЙ ОТСЧЁТ
       ========================= */

    const targetDate = new Date(
        "2026-09-05T18:00:00+03:00"
    ).getTime();


    function updateCountdown() {

        const now = new Date().getTime();

        let difference = targetDate - now;

        if (difference < 0) {
            difference = 0;
        }

        const days = Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

        const hours = Math.floor(
            (difference / (1000 * 60 * 60)) % 24
        );

        const minutes = Math.floor(
            (difference / (1000 * 60)) % 60
        );

        const seconds = Math.floor(
            (difference / 1000) % 60
        );


        document.getElementById("days").textContent =
            String(days).padStart(2, "0");

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");
    }


    updateCountdown();

    setInterval(updateCountdown, 1000);


    /* =========================
       МАРШРУТ
       ========================= */

    function openMap() {

        const address =
            "Гостевой дом ФаЗенда, Россия, п. Стрелка, хутор Дубовый Рынок, 7";

        const url =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(address);

        window.open(url, "_blank");
    }


    /* =========================
       WHATSAPP — ПРИДУ
       ========================= */

    function sendYes() {

        const message =
            "Здравствуйте! ❤️\n\n" +
            "Меня зовут ________.\n" +
            "Я с радостью приду на гендер-пати! ✨\n\n" +
            "Со мной будут:\n" +
            "• ________\n" +
            "• ________\n" +
            "• ________\n\n" +
            "До встречи! 💕";

        const url =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(message);

        window.open(url, "_blank");
    }


    /* =========================
       WHATSAPP — НЕ СМОГУ
       ========================= */

    function sendNo() {

        const message =
            "Здравствуйте! ❤️\n\n" +
            "К сожалению, у меня не получится прийти.\n\n" +
            "Поздравляю вас с этим прекрасным событием " +
            "и желаю чудесного праздника! ✨";

        const url =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(message);

        window.open(url, "_blank");
    }


    /* =========================
       СВАЙПЫ НА ТЕЛЕФОНЕ
       ========================= */

    let touchStartX = 0;
    let touchEndX = 0;


    document.addEventListener("touchstart", function(event) {

        touchStartX = event.changedTouches[0].screenX;

    }, { passive: true });


    document.addEventListener("touchend", function(event) {

        touchEndX = event.changedTouches[0].screenX;

        handleSwipe();

    }, { passive: true });


    function handleSwipe() {

        const distance = touchEndX - touchStartX;

        if (Math.abs(distance) < 60) {
            return;
        }

        if (distance < 0 && currentPage < totalPages) {

            goToPage(currentPage + 1);

        }

        if (distance > 0 && currentPage > 1) {

            goToPage(currentPage - 1);

        }
    }


    updateInterface();

</script>

</body>
</html>
