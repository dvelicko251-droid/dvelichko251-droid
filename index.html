<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Гендер-пати</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f8f1eb;
}

body {
    font-family: Arial, sans-serif;
}

/* Контейнер всех страниц */
.invitation {
    width: 100%;
    height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;

    -webkit-overflow-scrolling: touch;
}

/* Одна страница */
.page {
    position: relative;

    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    scroll-snap-align: start;
    scroll-snap-stop: always;

    overflow: hidden;
    flex-shrink: 0;
}

/* Картинка страницы */
.page > img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

/* =========================
   ТАЙМЕР — ПОКА ПУСТОЙ
   ========================= */

#liveCountdown {
    position: absolute;

    left: 8%;
    right: 8%;
    top: 36%;

    width: 84%;

    display: none;

    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

#liveCountdown .unit {
    width: 22%;
    text-align: center;
}

#liveCountdown .number {
    font-size: clamp(25px, 7vw, 52px);
    line-height: 1;

    color: #a77b52;

    font-variant-numeric: tabular-nums;
}

#liveCountdown .label {
    margin-top: 8px;

    font-family: Arial, sans-serif;
    font-size: clamp(10px, 2.7vw, 16px);

    color: #806a68;
}

/* На очень маленьких телефонах */
@media (max-width: 360px) {

    #liveCountdown {
        left: 6%;
        right: 6%;
        width: 88%;
    }

    #liveCountdown .number {
        font-size: 25px;
    }

    #liveCountdown .label {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<main class="invitation">

    <!-- СТРАНИЦА 1 -->
    <section class="page" id="page1">
        <img src="page1.jpg.PNG" alt="Гендер-пати — страница 1">
    </section>

    <!-- СТРАНИЦА 2 -->
    <section class="page" id="page2">
        <img src="page2.jpg.PNG" alt="Гендер-пати — страница 2">
    </section>

    <!-- СТРАНИЦА 3 -->
    <section class="page" id="page3">
        <img src="page3.jpg.PNG" alt="Гендер-пати — страница 3">
    </section>

    <!-- СТРАНИЦА 4 -->
    <section class="page" id="page4">
        <img src="page4.jpg.PNG" alt="До нашей встречи осталось">

        <!-- Таймер подключим следующим шагом -->
        <div id="liveCountdown">

            <div class="unit">
                <div class="number" id="days">--</div>
                <div class="label">Дней</div>
            </div>

            <div class="unit">
                <div class="number" id="hours">--</div>
                <div class="label">Часов</div>
            </div>

            <div class="unit">
                <div class="number" id="minutes">--</div>
                <div class="label">Минут</div>
            </div>

            <div class="unit">
                <div class="number" id="seconds">--</div>
                <div class="label">Секунд</div>
            </div>

        </div>
    </section>

    <!-- СТРАНИЦА 5 -->
    <section class="page" id="page5">
        <img src="page5.jpg.PNG" alt="Гендер-пати — страница 5">
    </section>

    <!-- СТРАНИЦА 6 -->
    <section class="page" id="page6">
        <img src="page6.jpg.PNG" alt="Гендер-пати — страница 6">
    </section>

    <!-- СТРАНИЦА 7 -->
    <section class="page" id="page7">
        <img src="page7.jpg.PNG" alt="Гендер-пати — страница 7">
    </section>

    <!-- СТРАНИЦА 8 -->
    <section class="page" id="page8">
        <img src="page8.jpg.PNG" alt="Гендер-пати — страница 8">
    </section>

</main>

<script>
/* Пока без интерактива.
   Следующим шагом добавим настоящий таймер
   и точно выставим его цифры на page4.
*/
</script>

</body>
</html>
