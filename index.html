<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Приглашение</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fdf8f5;
}

body {
    touch-action: none;
}

/* =====================================
   КОНТЕЙНЕР
   ===================================== */

#slider {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;
}

/* =====================================
   ЛЕНТА СТРАНИЦ
   ===================================== */

#pages {
    position: absolute;

    left: 0;
    top: 0;

    width: 100vw;
    height: 800dvh;

    transform: translateY(0);

    transition:
        transform 0.7s cubic-bezier(0.77, 0, 0.175, 1);
}

/* =====================================
   ОДНА СТРАНИЦА
   ===================================== */

.page {
    position: relative;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;
}

/*
   Картинка всегда занимает
   весь экран.
*/

.page img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    user-select: none;
    -webkit-user-drag: none;
}


/* =====================================
   КНОПКА «ОТКРЫТЬ ПРИГЛАШЕНИЕ»
   ===================================== */

/*
   Невидимая область поверх кнопки
   на ПЕРВОЙ картинке.
*/
#openInvitation {
    position: absolute;

    left: 50%;
    top: 57%;

    transform: translateX(-50%);

    width: 52%;
    height: 9%;

    border: 0;
    background: transparent;

    padding: 0;
    margin: 0;

    z-index: 100;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}



/* =====================================
   ТАЙМЕР — СТРАНИЦА 4
   ===================================== */

#page4 {
    position: relative;
}

/*
   Четыре цифры располагаются
   поверх четырёх кружочков.
*/
#liveCountdown {
    position: absolute;
    top: 36.5%;
    left:16%;
    right:16%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transform: translateY(-38px);
    z-index: 10;
}

#liveCountdown .unit {
    width: 22%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#liveCountdown .number {
    font-size: clamp(38px, 10vw, 70px);
    line-height: 1;
    font-weight: normal;
    color: #a8784b;
    text-align: center;
}

#liveCountdown .label {
    display: none;
}


.count {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;
}

.number {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(32px, 8vw, 58px);

    font-weight: normal;

    line-height: 1;

    color: #a77b52;

    text-align: center;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;
}


/* =====================================
   МОБИЛЬНЫЕ ЭКРАНЫ
   ===================================== */

@media (max-width: 600px) {

    #openInvitation {
        top: 57%;
        width: 54%;
        height: 9%;
    }

    #liveCountdown {
        left: 5%;
        right: 5%;
        top: 35.8%;
        height: 10%;
    }

    .number {
        font-size: clamp(31px, 8vw, 52px);
    }
}
</style>
</head>


<body>

<div id="slider">

    <div id="pages">


        <!-- =================================
             СТРАНИЦА 1
             ================================= -->

        <section class="page" id="page1">

            <img
                src="page1.jpg.PNG"
                alt="Приглашение">

            <button
                id="openInvitation"
                aria-label="Открыть приглашение">
            </button>

        </section>



        <!-- =================================
             СТРАНИЦА 2
             ================================= -->

        <section class="page" id="page2">

            <img
                src="page2.jpg.PNG"
                alt="Приглашение">

        </section>



        <!-- =================================
             СТРАНИЦА 3
             ================================= -->

        <section class="page" id="page3">

            <img
                src="page3.jpg.PNG"
                alt="Приглашение">

        </section>



        <!-- =================================
             СТРАНИЦА 4 — ТАЙМЕР
             ================================= -->

        <section class="page" id="page4">

            <img
                src="page4.jpg.PNG"
                alt="До нашей встречи осталось">


            <div id="liveCountdown">

                <div class="count">
                    <div
                        class="number"
                        id="days">
                        00
                    </div>
                </div>

                <div class="count">
                    <div
                        class="number"
                        id="hours">
                        00
                    </div>
                </div>

                <div class="count">
                    <div
                        class="number"
                        id="minutes">
                        00
                    </div>
                </div>

                <div class="count">
                    <div
                        class="number"
                        id="seconds">
                        00
                    </div>
                </div>

            </div>

        </section>



        <!-- =================================
             СТРАНИЦА 5
             ================================= -->

        <section class="page" id="page5">

            <img
                src="page5.jpg.PNG"
                alt="Приглашение">

        </section>



        <!-- =================================
             СТРАНИЦА 6
             ================================= -->

        <section class="page" id="page6">

            <img
                src="page6.jpg.PNG"
                alt="Приглашение">

        </section>



        <!-- =================================
             СТРАНИЦА 7
             ================================= -->

        <section class="page" id="page7">

            <img
                src="page7.jpg.PNG"
                alt="Ответ гостей">

        </section>



        <!-- =================================
             СТРАНИЦА 8
             ================================= -->

        <section class="page" id="page8">

            <img
                src="page8.jpg.PNG"
                alt="Приглашение">

        </section>


    </div>

</div>


<script>

/* =====================================
   НАСТРОЙКИ СТРАНИЦ
   ===================================== */

const pages = document.getElementById("pages");

const totalPages = 8;

let currentPage = 0;

let startY = 0;

let isMoving = false;


/* =====================================
   ПЕРЕХОД НА СТРАНИЦУ
   ===================================== */

function goToPage(page) {

    if (page < 0) {
        page = 0;
    }

    if (page > totalPages - 1) {
        page = totalPages - 1;
    }

    currentPage = page;

    pages.style.transform =
        "translateY(-" +
        (currentPage * 100) +
        "dvh)";
}


/* =====================================
   КНОПКА НА ПЕРВОЙ СТРАНИЦЕ
   ===================================== */

document
    .getElementById("openInvitation")
    .addEventListener("click", function () {

        goToPage(1);

    });


/* =====================================
   СВАЙП ВВЕРХ / ВНИЗ
   ===================================== */

document.addEventListener(
    "touchstart",
    function (event) {

        startY =
            event.touches[0].clientY;

    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    function (event) {

        if (isMoving) {
            return;
        }

        const endY =
            event.changedTouches[0].clientY;

        const difference =
            startY - endY;


        /*
           Слишком маленькое движение
           считаем обычным касанием.
        */

        if (Math.abs(difference) < 50) {
            return;
        }


        isMoving = true;


        /* Свайп вверх */

        if (difference > 0) {

            if (currentPage < totalPages - 1) {

                goToPage(currentPage + 1);

            }

        }


        /* Свайп вниз */

        else {

            if (currentPage > 0) {

                goToPage(currentPage - 1);

            }

        }


        /*
           Небольшая блокировка,
           чтобы один свайп не перелистнул
           сразу несколько страниц.
        */

        setTimeout(
            function () {
                isMoving = false;
            },
            750
        );

    },
    { passive: true }
);


/* =====================================
   ТАЙМЕР
   ===================================== */

/*
   5 сентября 2026 года
   18:00
*/

const targetDate =
    new Date(
        "2026-09-05T18:00:00+03:00"
    ).getTime();


function updateCountdown() {

    const now =
        new Date().getTime();

    let difference =
        targetDate - now;


    if (difference < 0) {
        difference = 0;
    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );


    document.getElementById("days")
        .textContent =
        String(days).padStart(2, "0");


    document.getElementById("hours")
        .textContent =
        String(hours).padStart(2, "0");


    document.getElementById("minutes")
        .textContent =
        String(minutes).padStart(2, "0");


    document.getElementById("seconds")
        .textContent =
        String(seconds).padStart(2, "0");

}


/* Запуск */

updateCountdown();


/* Обновление каждую секунду */

setInterval(
    updateCountdown,
    1000
);

</script>

</body>
</html>
